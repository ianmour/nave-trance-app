<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --amarelo: #ffd23f;
        --branco: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .legenda {
        position: absolute; left: 0; right: 0; top: 1060px;
        text-align: center; overflow: visible;
        font-family: "Poppins"; font-weight: 700; font-style: italic;
        font-size: 64px; color: var(--amarelo);
        text-shadow: 0 4px 16px rgba(0,0,0,0.6);
      }
      .destaque {
        position: absolute; left: 0; right: 0; top: 760px;
        text-align: center; overflow: visible;
        font-family: "Archivo Black"; font-size: 200px; line-height: 1;
        color: var(--branco); text-shadow: 0 8px 30px rgba(0,0,0,0.5);
      }
      .destaque span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <video id="fundo" class="clip" src="assets/teste.mp4" data-start="0" data-duration="2" data-track-index="0" data-has-audio="true"></video>
      <div id="l1" class="clip legenda" data-start="0.15" data-duration="0.75" data-track-index="1"><span>olá,</span></div>
      <div id="l2" class="clip legenda" data-start="0.9" data-duration="0.5" data-track-index="1"><span>esse é um</span></div>
      <div id="d1" class="clip destaque" data-start="1.3" data-duration="0.7" data-track-index="2"><span>TESTE</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#l1 span", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }, 0.15);
      tl.fromTo("#l2 span", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }, 0.9);
      tl.fromTo("#d1 span", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
