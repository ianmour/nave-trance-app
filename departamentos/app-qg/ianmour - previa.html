<style>:root{
  --noite:#0A0A14; --noite-2:#14142A; --noite-3:#1E1E3A;
  --rosa:#FC3B7F; --azul:#0032A8; --azul-claro:#2F63E0; --creme:#FEF1CF;
  --verde:#3BE38C; --amarelo:#FFC83B;
  --suave:rgba(254,241,207,.62); --linha:rgba(254,241,207,.14);
  --sombra-rosa:5px 5px 0 var(--rosa); --sombra-azul:5px 5px 0 var(--azul);
  --seguro-baixo:env(safe-area-inset-bottom,0px); --seguro-topo:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--noite);color:var(--creme);font:16px/1.5 "Archivo",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(254,241,207,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(254,241,207,.035) 1px,transparent 1px);background-size:24px 24px}
.px{font-family:"Silkscreen",monospace;letter-spacing:.04em}
.pequeno{font-size:12px}
.rosa{color:var(--rosa)}
.titulo-grande{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(64px,19vw,128px);line-height:.9;margin:4px 0 6px;letter-spacing:.02em;
  color:var(--creme);text-shadow:6px 6px 0 var(--rosa)}
svg{display:block;width:100%;height:100%}
[hidden]{display:none!important}

/* ENTRADA */
.entrada{min-height:100%;display:grid;place-items:center;padding:24px 16px calc(24px + var(--seguro-baixo));
  background:radial-gradient(circle at 50% 30%,rgba(252,59,127,.22),transparent 55%),radial-gradient(circle at 50% 100%,rgba(0,50,168,.35),transparent 60%)}
.entrada-caixa{width:100%;max-width:360px;text-align:center}
.logo-pixel{width:84px;height:84px;margin:0 auto 14px;background:var(--azul);padding:14px;box-shadow:var(--sombra-rosa)}
.nome-entrada{font-weight:400;margin:0 0 26px;font-size:13px}
.piscando{animation:piscar 1.1s steps(2,end) infinite;color:var(--creme);margin:6px 0 22px}
@keyframes piscar{50%{opacity:0}}
#form-senha{display:grid;gap:12px}
#senha{font:inherit;font-size:18px;padding:14px 16px;border:3px solid var(--creme);background:var(--noite);color:var(--creme);border-radius:0;text-align:center;outline:none}
#senha:focus{border-color:var(--rosa)}
.botao-jogo{font-family:"Silkscreen",monospace;font-size:16px;font-weight:700;letter-spacing:.06em;border:0;background:var(--rosa);color:var(--noite);padding:14px 18px;cursor:pointer;box-shadow:var(--sombra-azul);transition:transform .08s steps(2)}
.botao-jogo:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--azul)}
.botao-jogo.pequeno{font-size:12px;padding:9px 12px;box-shadow:3px 3px 0 var(--azul)}
.botao-jogo.azul{background:var(--azul);color:var(--creme);box-shadow:var(--sombra-rosa)}
.erro{color:var(--rosa);margin-top:14px;font-size:13px;animation:tremer .3s steps(3)}
@keyframes tremer{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}

/* TOPO E NAVEGAÇÃO */
.topo{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--seguro-topo)) 16px 10px;background:rgba(10,10,20,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--linha)}
.marca{display:flex;align-items:center;gap:10px}
.nome-app{font-family:"Anton",sans-serif;font-size:24px;letter-spacing:.03em;line-height:1}
.logo-mini{width:28px;height:28px;background:var(--azul);padding:5px;box-shadow:2px 2px 0 var(--rosa)}
.sair{background:none;border:2px solid var(--linha);color:var(--suave);font-size:11px;padding:6px 10px;cursor:pointer}
.conteudo{max-width:1040px;margin:0 auto;padding:20px 16px calc(110px + var(--seguro-baixo))}
.barra-baixo{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + var(--seguro-baixo));background:var(--noite-2);border-top:3px solid var(--rosa)}
.barra-baixo button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--suave);padding:6px 4px;cursor:pointer;font-size:11px}
.barra-baixo .ic{width:26px;height:26px;opacity:.6}
.barra-baixo button.ativo{color:var(--creme)}
.barra-baixo button.ativo .ic{opacity:1}
.barra-baixo button.ativo .px{border-bottom:3px solid var(--rosa)}

/* TÍTULOS */
.ola{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(38px,9vw,60px);line-height:1;margin:4px 0 18px;letter-spacing:.01em}
.cabeca{display:flex;gap:16px;align-items:center;margin:4px 0 22px}
.cabeca h2{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(32px,7vw,48px);line-height:1;margin:0 0 6px;letter-spacing:.01em}
.cabeca p{color:var(--suave);margin:0;max-width:60ch}
.cabeca.simples{display:block}
.rosa{color:var(--rosa)}

/* CONTINUAR (cartão de save, dividido como a foto de perfil) */
.save{position:relative;display:grid;grid-template-columns:1fr;border:3px solid var(--creme);box-shadow:8px 8px 0 var(--rosa);margin-bottom:34px;overflow:hidden;
  background:linear-gradient(90deg,var(--rosa) 0 50%,var(--azul) 50% 100%)}
.save:before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 0 50%,rgba(10,10,20,.0) 50%),
  repeating-linear-gradient(0deg,rgba(10,10,20,.16) 0 2px,transparent 2px 6px);pointer-events:none}
.save-corpo{position:relative;margin:18px;padding:18px;background:var(--noite);border:3px solid var(--creme);display:flex;flex-direction:column;gap:10px}
.save-rot{color:var(--rosa);font-size:13px}
.save h3{font-family:"Anton",sans-serif;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1;margin:0;letter-spacing:.01em}
.save p{margin:0;color:var(--suave)}
.save .botao-jogo{align-self:stretch;margin-top:6px;font-size:13px;letter-spacing:.02em;white-space:nowrap}
@media(min-width:720px){.save .botao-jogo{align-self:flex-start;font-size:16px}}
.save-arte{display:none}
@media(min-width:720px){.save{grid-template-columns:1fr 1fr}.save-corpo{margin:28px 28px 28px 0}
  .save-arte{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:28px 36px;position:relative}
  .save-arte .grande-ic{width:120px;height:120px;filter:drop-shadow(6px 6px 0 var(--noite))}
  .save-arte b{font-family:"Anton",sans-serif;font-weight:400;font-size:64px;line-height:.9;color:var(--creme);text-shadow:5px 5px 0 var(--noite)}}


/* MAPA */
.cabeca-mapa h2{font-family:"Anton",sans-serif;font-weight:400;font-size:30px;margin:0 0 4px;letter-spacing:.01em}
.cabeca-mapa p{margin:0 0 8px;color:var(--suave)}
.mapa{position:relative;margin:0 -6px}
.trilha{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trilha path{fill:none;stroke-linejoin:miter}
.trilha-toda{stroke:rgba(254,241,207,.28);stroke-width:6;stroke-dasharray:8 8}
.trilha-feita{stroke:var(--rosa);stroke-width:6}
.fase{all:unset;position:absolute;transform:translateX(-50%);width:150px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center}
.fase-bloco{position:relative;display:grid;place-items:center;width:92px;height:92px;padding:20px;background:var(--azul);border:3px solid var(--creme);box-shadow:5px 5px 0 var(--rosa)}
.fase:hover .fase-bloco,.fase:focus-visible .fase-bloco{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--rosa)}
.fase:focus-visible .fase-bloco{outline:3px solid var(--rosa);outline-offset:4px}
.fase:active .fase-bloco{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--rosa)}
.fase-bloco em{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;white-space:nowrap;background:var(--amarelo);color:var(--noite);padding:2px 6px}
.fase.bloqueado .fase-bloco{background:var(--noite-3);border-color:rgba(254,241,207,.35);box-shadow:none}
.fase.bloqueado .fase-bloco em{background:var(--noite-3);color:var(--suave);border:1px solid var(--linha)}
.fase.bloqueado .fase-nome{color:var(--suave)}
.fase-nome{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;line-height:1.2;background:var(--noite);padding:2px 6px;margin-top:4px}
.estrelas{display:flex;gap:4px}
.estrelas i{width:12px;height:12px;background:var(--noite-3);border:2px solid rgba(254,241,207,.3)}
.estrelas i.cheio{background:var(--amarelo);border-color:var(--amarelo)}
.fase-bloco.grande{flex:none;width:84px;height:84px;padding:18px}
.fase-bloco.grande.bloqueado{background:var(--noite-3);box-shadow:none}

/* DETALHE */
.voltar{background:none;border:0;color:var(--suave);cursor:pointer;padding:6px 0;margin-bottom:10px;font-size:13px}
.painel{background:var(--noite-2);border:3px solid var(--creme);padding:18px;box-shadow:5px 5px 0 var(--azul);margin-bottom:18px}
.painel h3{font-family:"Anton",sans-serif;font-weight:400;font-size:22px;margin:0 0 12px;letter-spacing:.01em}
.itens{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.itens li{display:flex;align-items:center;gap:8px;background:var(--noite-3);padding:8px 12px;font-size:15px}
.itens li.clicavel{cursor:pointer;border:2px solid var(--rosa)}
.itens li .ic{width:16px;height:16px;flex:none}
.pedido-texto{background:var(--noite);border:2px dashed var(--rosa);padding:12px;font-size:16px;margin:0 0 12px}

/* CLIENTES */
.clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.cliente{all:unset;cursor:pointer;display:flex;gap:16px;align-items:flex-start;background:var(--noite-2);border:3px solid var(--creme);padding:16px;box-shadow:6px 6px 0 var(--rosa)}
.cliente:focus-visible{outline:3px solid var(--rosa);outline-offset:4px}
.cliente:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--rosa)}
.cli-info{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.avatar{flex:none;width:64px;height:64px;display:grid;place-items:center;font-family:"Anton",sans-serif;font-size:34px;color:var(--creme);border:3px solid var(--creme);box-shadow:4px 4px 0 var(--rosa)}
.avatar.grande{width:84px;height:84px;font-size:44px}
.cliente h3{font-family:"Anton",sans-serif;font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
.cliente p{margin:0;color:var(--suave);font-size:14px}
.barra-xp{height:18px;background:repeating-linear-gradient(90deg,var(--noite-3) 0 10px,var(--noite) 10px 12px);border:3px solid var(--creme);position:relative}
.barra-xp b{position:absolute;inset:0 auto 0 0;min-width:0;background:repeating-linear-gradient(90deg,var(--rosa) 0 10px,#ff76a6 10px 12px)}
.linha-xp{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--suave)}
.ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0}
.ficha div{background:var(--noite-3);padding:10px 12px}
.ficha dt{font-size:13px;color:var(--rosa);font-weight:700}
.ficha dd{margin:2px 0 0;font-size:16px}
.amostra{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:8px;border:2px solid var(--creme)}
.mes{display:flex;flex-direction:column;gap:14px}
.mes-numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ponto{background:var(--noite);border:2px solid var(--linha);padding:12px}
.ponto b{display:block;font-family:"Anton",sans-serif;font-weight:400;font-size:34px;line-height:1}
.ponto b small{font-size:18px;color:var(--suave)}
.ponto span{font-size:13px;color:var(--suave)}
.mes .botao-jogo{align-self:flex-start}
.novo{color:var(--suave);font-size:15px;border:2px dashed var(--linha);padding:14px;text-align:center}

/* SOBRE */
.sobre{display:grid;gap:26px;align-items:center;grid-template-columns:1fr;margin-top:10px}
@media(min-width:720px){.sobre{grid-template-columns:280px 1fr}}
.foto{width:240px;height:240px;margin:0 auto;border:4px solid var(--creme);box-shadow:8px 8px 0 var(--rosa);background:linear-gradient(90deg,var(--rosa) 50%,var(--azul) 50%);display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.foto .px{background:var(--noite);padding:8px 10px;font-size:12px;text-align:center}
.sobre h2{font-family:"Anton",sans-serif;font-weight:400;font-size:clamp(46px,10vw,72px);margin:6px 0 10px;line-height:1;letter-spacing:.01em}
.sobre p{margin:0;max-width:52ch;font-size:17px}
.rodape{margin-top:34px;color:var(--suave);font-size:12px;text-align:center}

/* VISOR */
.visor{position:fixed;inset:0;z-index:20;background:var(--noite);display:flex;flex-direction:column}
.visor-topo{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--seguro-topo)) 12px 10px;border-bottom:3px solid var(--rosa);font-size:12px}
.visor iframe{flex:1;width:100%;border:0;background:#fff}

@media(max-width:420px){.mes-numeros{gap:6px}.ponto{padding:10px}.ponto b{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ENTRADA -->
<section id="tela-entrada" class="entrada">
  <div class="entrada-caixa">
    <div class="logo-pixel" id="logo-entrada"></div>
    <h1 class="px pequeno rosa nome-entrada">agência</h1>
    <p class="px piscando">PRESS START</p>
    <div id="form-senha">
      <input id="senha" type="password" inputmode="text" placeholder="senha" aria-label="Senha" autocomplete="current-password">
      <button class="botao-jogo" type="button" id="entrar">ENTRAR ▶</button>
    </div>
    <p class="erro px" id="erro-senha" hidden>SENHA ERRADA · TENTE DE NOVO</p>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="topo">
    <div class="marca"><span class="logo-mini" id="logo-mini"></span><span class="nome-app">ianmour</span></div>
    <button class="sair px" id="sair">Sair</button>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <nav class="barra-baixo" aria-label="Navegação">
    <button data-tela="mundos" class="ativo"><span class="ic" data-simbolo="controle"></span><span class="px">Mapa</span></button>
    <button data-tela="clientes"><span class="ic" data-simbolo="mira"></span><span class="px">Clientes</span></button>
    <button data-tela="sobre"><span class="ic" data-simbolo="faisca"></span><span class="px">Sobre</span></button>
  </nav>
</div>

<!-- VISOR DE ENTREGAS (abre as páginas dentro do app) -->
<div id="visor" class="visor" hidden>
  <div class="visor-topo"><button class="botao-jogo pequeno" id="fechar-visor">◀ Voltar</button><span class="px" id="visor-titulo"></span></div>
  <iframe id="visor-frame" title="Entrega"></iframe>
</div>

    return r;
  }
  function xp(n, max) { var h = '<div class="xp">'; for (var i = 0; i < max; i++) h += '<i class="' + (i < n ? 'cheio' : '') + '"></i>'; return h + '<span class="px">NÍVEL ' + n + '/' + max + '</span></div>'; }

  // NAVEGAÇÃO
  function ir(rota) {
    var partes = rota.split('/'), tela = partes[0];
    Array.prototype.forEach.call(document.querySelectorAll('.barra-baixo button'), function (b) { var aba = tela === 'cliente' ? 'clientes' : tela === 'mundo' ? 'mundos' : tela; b.classList.toggle('ativo', b.getAttribute('data-tela') === aba); });
    var c = $('conteudo');
    if (tela === 'mundo') c.innerHTML = telaMundo(partes[1]);
    else if (tela === 'cliente') c.innerHTML = telaCliente(partes[1]);
    else if (tela === 'clientes') c.innerHTML = telaClientes();
    else if (tela === 'sobre') c.innerHTML = telaSobre();
    else c.innerHTML = telaMundos();
    try { if (location.hash.slice(1) !== rota) history.replaceState(null, '', '#' + rota); } catch (e) {}
    window.scrollTo(0, 0); ligar(); desenharMapa();
  }
  window.addEventListener('hashchange', function () { if (!$('app').hidden) ir(rotaInicial()); });
  Array.prototype.forEach.call(document.querySelectorAll('.barra-baixo button'), function (b) { b.onclick = function () { ir(b.getAttribute('data-tela')); }; });

  function ligar() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-ir]'), function (el) { el.onclick = function () { ir(el.getAttribute('data-ir')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-abrir]'), function (el) { el.onclick = function () { abrirEntrega(el.getAttribute('data-abrir'), el.getAttribute('data-titulo')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copiar]'), function (el) { el.onclick = function () {
      var t = el.getAttribute('data-copiar'); try { navigator.clipboard.writeText(t); el.textContent = 'Copiado ✓'; } catch (e) {} }; });
  }

  // TELAS
  function mesAtual() {
    var melhor = null;
    Q.clientes.forEach(function (c) { var m = c.meses[c.meses.length - 1]; if (m && !melhor) melhor = { c: c, m: m }; });
    return melhor;
  }
  function barra(v, max) { var pct = max ? Math.round(100 * v / max) : 0; return '<div class="barra-xp"><b style="width:' + pct + '%"></b></div>'; }

  function telaMundos() {
    var h = '<h2 class="ola">Olá, player 1</h2>';
    var a = mesAtual();
    if (a) {
      var p = progresso(a.m);
      h += '<section class="save"><div class="save-arte" aria-hidden="true"><span class="grande-ic">' + sim('faisca', 'creme') + '</span><b>' + esc(a.m.nome.split(' ')[0]) + '</b></div><div class="save-corpo">' +
        '<span class="px save-rot">Continuar</span><h3>' + esc(a.c.nome) + '</h3><p>' + esc(a.m.nome) + ' · ' + a.m.posts + ' posts</p>' +
        barra(p.aprovados, a.m.posts) + '<div class="linha-xp px"><span>' + p.aprovados + ' de ' + a.m.posts + ' aprovados</span><span>' + p.recebidos + ' de ' + a.m.pedidos + ' gravações</span></div>' +
        '<button class="botao-jogo" data-abrir="' + esc(a.m.arquivo) + '" data-titulo="' + esc(a.c.nome + ' · ' + a.m.nome) + '">Abrir planejamento ▶</button></div></section>';
    }
    h += '<div class="cabeca-mapa"><h2>Mapa da agência</h2><p>Cada fase é um departamento. Toque para ver o que ela já faz.</p></div>';
    h += '<div class="mapa" id="mapa"><svg class="trilha" id="trilha" aria-hidden="true"></svg>' + Q.mundos.map(function (m, i) {
      var travado = m.status === 'bloqueado';
      var estrelas = ''; for (var k = 0; k < m.max; k++) estrelas += '<i class="' + (k < m.nivel ? 'cheio' : '') + '"></i>';
      return '<button class="fase ' + m.status + '" data-ir="mundo/' + m.id + '" data-i="' + i + '"><span class="fase-bloco">' + sim(m.simbolo, travado ? 'noite' : 'creme') +
        (m.status === 'construindo' ? '<em class="px">obra</em>' : travado ? '<em class="px">em breve</em>' : '') + '</span>' +
        '<span class="fase-nome">' + esc(m.nome) + '</span><span class="estrelas">' + estrelas + '</span></button>';
    }).join('') + '</div>';
    return h;
  }

  // desenha o caminho entre as fases (cobra: esquerda→direita, desce, direita→esquerda)
  function desenharMapa() {
    var mapa = $('mapa'); if (!mapa) return;
    var cols = mapa.clientWidth >= 640 ? 4 : 2, fases = mapa.querySelectorAll('.fase'), linhaAlt = cols === 4 ? 190 : 170;
    var larg = mapa.clientWidth, pontos = [];
    Array.prototype.forEach.call(fases, function (f, i) {
      var lin = Math.floor(i / cols), col = i % cols; if (lin % 2) col = cols - 1 - col;
      var x = (col + 0.5) * larg / cols, y = lin * linhaAlt + 46;
      f.style.left = x + 'px'; f.style.top = (y - 46) + 'px'; pontos.push([x, y]);
    });
    mapa.style.height = (Math.ceil(fases.length / cols) * linhaAlt) + 'px';
    var ultimoPronto = -1; Q.mundos.forEach(function (m, i) { if (m.status === 'pronto' && ultimoPronto === i - 1) ultimoPronto = i; });
    function caminho(ate) { var d = ''; for (var i = 0; i <= ate && i < pontos.length; i++) { var pt = pontos[i];
      if (i === 0) d += 'M' + pt[0] + ' ' + pt[1]; else { var ant = pontos[i - 1]; if (ant[1] !== pt[1]) d += ' L' + ant[0] + ' ' + pt[1]; d += ' L' + pt[0] + ' ' + pt[1]; } } return d; }
    var t = $('trilha'); t.setAttribute('viewBox', '0 0 ' + larg + ' ' + mapa.clientHeight);
    t.innerHTML = '<path d="' + caminho(pontos.length - 1) + '" class="trilha-toda"/><path d="' + caminho(ultimoPronto) + '" class="trilha-feita"/>';
  }
  window.addEventListener('resize', desenharMapa);

  function telaMundo(id) {
    var m = Q.mundos.filter(function (x) { return x.id === id; })[0]; if (!m) return telaMundos();
    var h = '<button class="voltar px" data-ir="mundos">◀ Mapa</button>';
    h += '<div class="cabeca"><span class="fase-bloco grande ' + m.status + '">' + sim(m.simbolo, m.status === 'bloqueado' ? 'noite' : 'creme') + '</span><div><h2>' + esc(m.nome) + '</h2><p>' + esc(m.faz) + '</p></div></div>';
    if (m.ferramentas.length) h += '<div class="painel"><h3>O que já faz</h3><ul class="itens">' + m.ferramentas.map(function (f) { return '<li><span class="ic">' + sim('feito', 'rosa') + '</span>' + esc(f) + '</li>'; }).join('') + '</ul></div>';
    if (m.pedido) h += '<div class="painel"><h3>Como pedir na aba do Claude</h3><div class="pedido-texto">' + esc(m.pedido) + '</div><button class="botao-jogo pequeno" data-copiar="' + esc(m.pedido) + '">Copiar pedido</button></div>';
    if (m.id === 'ideias') h += entregasDeTodos();
    if (m.status === 'bloqueado') h += '<div class="novo">Esta fase ainda não foi liberada. Quando quiser, a gente monta.</div>';
    return h;
  }

  function entregasDeTodos() {
    var h = '<div class="painel"><h3>Planejamentos</h3><ul class="itens">';
    Q.clientes.forEach(function (c) { c.meses.forEach(function (m) { h += '<li class="clicavel" data-abrir="' + esc(m.arquivo) + '" data-titulo="' + esc(c.nome + ' · ' + m.nome) + '"><span class="ic">' + sim('play', 'rosa') + '</span>' + esc(c.nome) + ' · ' + esc(m.nome) + '</li>'; }); });
    return h + '</ul></div>';
  }

  function telaClientes() {
    var h = '<div class="cabeca simples"><h2>Clientes</h2><p>Escolha um cliente para ver a ficha e o placar do mês.</p></div><div class="clientes">';
    h += Q.clientes.map(function (c) {
      var m = c.meses[c.meses.length - 1], p = progresso(m);
      return '<button class="cliente" data-ir="cliente/' + c.id + '"><span class="avatar" style="background:' + c.cor + '">' + esc(c.nome[0]) + '</span><div class="cli-info"><h3>' + esc(c.nome) + '</h3><p>' + esc(c.assunto) + '</p>' +
        (m ? barra(p.aprovados, m.posts) + '<div class="linha-xp px"><span>' + esc(m.nome) + '</span><span>' + p.aprovados + '/' + m.posts + ' aprovados</span></div>' : '') + '</div></button>';
    }).join('');
    return h + '</div><p class="novo">Cliente novo? Na aba de Ideias, diga o nome, o assunto e o público. Ele aparece aqui.</p>';
  }

  function telaCliente(id) {
    var c = Q.clientes.filter(function (x) { return x.id === id; })[0]; if (!c) return telaClientes();
    var h = '<button class="voltar px" data-ir="clientes">◀ Clientes</button>';
    h += '<div class="cabeca"><span class="avatar grande" style="background:' + c.cor + '">' + esc(c.nome[0]) + '</span><div><h2>' + esc(c.nome) + '</h2><p>' + esc(c.assunto) + '</p></div></div>';
    h += '<div class="painel"><h3>Ficha</h3><dl class="ficha"><div><dt>Formato</dt><dd>' + esc(c.formato) + '</dd></div><div><dt>Voz das narrações</dt><dd>' + esc(c.voz) + '</dd></div><div><dt>Cor</dt><dd><span class="amostra" style="background:' + c.cor + '"></span>' + esc(c.cor) + '</dd></div></dl></div>';
    c.meses.slice().reverse().forEach(function (m) {
      var p = progresso(m);
      h += '<div class="painel mes"><h3>' + esc(m.nome) + '</h3><div class="mes-numeros">' +
        '<div class="ponto"><b>' + p.aprovados + '<small>/' + m.posts + '</small></b><span>aprovados</span></div>' +
        '<div class="ponto"><b>' + p.postados + '<small>/' + m.posts + '</small></b><span>postados</span></div>' +
        '<div class="ponto"><b>' + p.recebidos + '<small>/' + m.pedidos + '</small></b><span>gravações recebidas</span></div></div>' +
        '<button class="botao-jogo" data-abrir="' + esc(m.arquivo) + '" data-titulo="' + esc(c.nome + ' · ' + m.nome) + '">Abrir planejamento ▶</button></div>';
    });
    return h;
  }

  function telaSobre() {
    var s = Q.sobre;
    return '<div class="sobre"><div class="foto">' +
      (s.foto ? '<img src="' + esc(s.foto) + '" alt="Foto de ' + esc(s.nome) + '">' : '<span class="px">sua foto<br>aqui</span>') +
      '</div><div><span class="px rosa">' + esc(s.linha) + '</span><h2>' + esc(s.nome) + '</h2><p>' + esc(s.texto) + '</p></div></div>' +
      '<p class="rodape px">ianmour · versão ' + esc(Q.versao) + '</p>';
  }

  // VISOR
  function abrirEntrega(arq, titulo) { $('visor-titulo').textContent = (titulo || '').toUpperCase(); $('visor-frame').src = arq; $('visor').hidden = false; }
  $('fechar-visor').onclick = function () { $('visor').hidden = true; $('visor-frame').src = 'about:blank'; ir(rotaInicial()); };

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
