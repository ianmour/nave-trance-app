<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Post de teste: símbolos ianmour em uso num carrossel (2 lâminas). -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Silkscreen:wght@400;700&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="../simbolos.js"></script>
<style>
  :root { --rosa:#FC3B7F; --creme:#FEF1CF; --azul:#0032A8; --noite:#0A0A14; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; }
  .lamina { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--noite); color:var(--creme); font-family:'Archivo', sans-serif; }
  .lamina::before { content:''; position:absolute; inset:0;
    background-image: linear-gradient(rgba(254,241,207,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(254,241,207,.045) 1px, transparent 1px);
    background-size:54px 54px; }
  .s svg { width:100%; height:100%; display:block; overflow:visible; }
  .marca { position:absolute; left:72px; bottom:64px; font-family:'Silkscreen'; font-size:30px; letter-spacing:2px; }
  h1 { position:absolute; left:72px; right:72px; font-family:'Anton'; text-transform:uppercase; line-height:.9; }
  .carimbo { position:absolute; background:var(--azul); box-shadow:12px 12px 0 var(--rosa); display:grid; place-items:center; }
  .item { display:flex; gap:40px; align-items:center; margin-bottom:70px; }
  .item .s { width:124px; height:124px; flex:none; }
  .item p { font-size:54px; line-height:1.15; font-weight:700; }
  .item span { display:block; font-size:34px; font-weight:500; opacity:.8; margin-top:6px; }
</style>
</head>
<body>
<section class="lamina">
  <div class="s" data-s="faisca:rosa" style="position:absolute; left:820px; top:150px; width:150px; height:150px"></div>
  <h1 style="top:300px; font-size:210px; color:var(--creme)">Seu vídeo<br><span style="color:var(--rosa)">perde</span><br>gente aqui</h1>
  <div class="carimbo" style="left:72px; top:1010px; width:120px; height:120px"><div class="s" data-s="olho:creme" style="width:80px;height:80px"></div></div>
  <p style="position:absolute; left:230px; top:1022px; font-size:38px; font-weight:700; line-height:1.2">Nos 3 primeiros<br>segundos.</p>
  <div class="s" data-s="seta:rosa" style="position:absolute; right:72px; bottom:52px; width:90px; height:90px"></div>
  <div class="marca">@IANMOUR</div>
</section>
<section class="lamina" style="background:var(--azul)">
  <h1 style="top:120px; font-size:120px">Como segurar</h1>
  <div style="position:absolute; left:72px; right:72px; top:350px">
    <div class="item"><div class="s" data-s="raio:creme"></div><p>Comece pelo impacto<span>A frase mais forte vem primeiro.</span></p></div>
    <div class="item"><div class="s" data-s="mira:creme"></div><p>Uma ideia por vídeo<span>Foco num assunto só.</span></p></div>
    <div class="item"><div class="s" data-s="fala:creme"></div><p>Fale com uma pessoa<span>"Você", não "vocês".</span></p></div>
    <div class="item"><div class="s" data-s="feito:creme"></div><p>Corte as pausas<span>Respiro, sem silêncio morto.</span></p></div>
  </div>
  <div class="marca">@IANMOUR</div>
</section>
<script>
  document.querySelectorAll('[data-s]').forEach(e => { const [n, c] = e.dataset.s.split(':'); e.innerHTML = window.SIMBOLOS[n].svg[c]; });
</script>
</body>
</html>
