<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Vinheta de teste: os símbolos ianmour animados em vídeo (1080x1920). Quadros gerados por demo/gravar-vinheta.cjs. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<script src="../simbolos.js"></script>
<style>
  :root { --rosa:#FC3B7F; --creme:#FEF1CF; --azul:#0032A8; --noite:#0A0A14; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; overflow:hidden; background:var(--noite); position:relative; }
  body::before { content:''; position:absolute; inset:0;
    background-image: linear-gradient(rgba(254,241,207,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(254,241,207,.045) 1px, transparent 1px);
    background-size:54px 54px; }
  .cena { position:absolute; inset:0; display:none; }
  .palavra { position:absolute; left:0; right:0; text-align:center; font-family:'Anton'; text-transform:uppercase; line-height:.9; }
  .sim { position:absolute; }
  .sim svg { width:100%; height:100%; display:block; overflow:visible; }
  .carimbo { position:absolute; background:var(--azul); box-shadow:22px 22px 0 var(--rosa); }
  .px { font-family:'Silkscreen'; }
</style>
</head>
<body>
  <!-- 1: IDEIA + faísca -->
  <div class="cena" id="c1">
    <div class="palavra" id="w1" style="top:820px; font-size:300px; color:var(--rosa)">IDEIA</div>
    <div class="sim" id="s1" style="left:760px; top:560px; width:230px; height:230px"></div>
  </div>
  <!-- 2: carimbo com raio + IMPACTO -->
  <div class="cena" id="c2">
    <div class="carimbo" id="k2" style="left:330px; top:560px; width:420px; height:420px"></div>
    <div class="sim" id="s2" style="left:400px; top:620px; width:290px; height:290px"></div>
    <div class="palavra" id="w2" style="top:1120px; font-size:200px; color:var(--creme)">IMPACTO</div>
  </div>
  <!-- 3: ARRASTA + seta -->
  <div class="cena" id="c3">
    <div class="palavra" id="w3" style="top:720px; font-size:250px; color:var(--rosa)">ARRASTA</div>
    <div class="sim" id="s3" style="left:400px; top:1030px; width:260px; height:260px"></div>
  </div>
  <!-- 4: assinatura -->
  <div class="cena" id="c4">
    <div class="sim" id="s4" style="left:450px; top:700px; width:180px; height:180px"></div>
    <div class="palavra px" id="w4" style="top:940px; font-size:78px; color:var(--creme); letter-spacing:6px">@IANMOUR</div>
  </div>
<script>
  // Monta cada símbolo como pixels separados, em ordem embaralhada (para "montar pixel por pixel").
  function montar(id, nome, cor) {
    const box = document.getElementById(id);
    box.innerHTML = window.SIMBOLOS[nome].svg[cor];
    const svg = box.querySelector('svg');
    const pix = [];
    svg.querySelectorAll('g rect').forEach(r => {           // quebra cada faixa em pixels de 1x1
      const x = +r.getAttribute('x'), y = +r.getAttribute('y'), w = +r.getAttribute('width');
      for (let i = 0; i < w; i++) { const p = document.createElementNS('http://www.w3.org/2000/svg','rect');
        p.setAttribute('x', x+i); p.setAttribute('y', y); p.setAttribute('width', 1.02); p.setAttribute('height', 1.02);
        r.parentNode.appendChild(p); pix.push(p); }
      r.remove();
    });
    let semente = nome.length * 97;
    const aleat = () => (semente = (semente * 9301 + 49297) % 233280) / 233280;
    pix.forEach(p => p.dataset.ordem = aleat());
    const solto = svg.querySelector(':scope > rect');
    return { pix, solto, box };
  }
  const S = { s1: montar('s1','faisca','creme'), s2: montar('s2','raio','creme'), s3: montar('s3','seta','creme'), s4: montar('s4','faisca','rosa') };

  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
  const passo = (x, n) => Math.floor(Math.min(Math.max(x,0),1) * n) / n;   // movimento "em degraus", jeito de jogo
  function construir(sim, t0, dur, t) { sim.pix.forEach(p => p.style.opacity = (t - t0) / dur >= +p.dataset.ordem ? 1 : 0);
    sim.solto.style.opacity = t < t0 + dur ? 0 : (Math.floor((t - t0 - dur) * 4) % 2 ? .25 : 1); }
  function cena(id) { ['c1','c2','c3','c4'].forEach(c => document.getElementById(c).style.display = c === id ? 'block' : 'none'); }

  window.quadro = t => {
    if (t < 2.2) {                                       // 1
      cena('c1');
      const w = document.getElementById('w1'); const k = passo((t - .05) / .25, 4);
      w.style.transform = `scale(${0.6 + 0.4 * k})`; w.style.opacity = k > 0 ? 1 : 0;
      construir(S.s1, .35, .6, t);
      const pulso = t > 1.1 ? 1 + .06 * Math.sin((t - 1.1) * 9) : 1; S.s1.box.style.transform = `scale(${pulso})`;
    } else if (t < 4.4) {                                // 2
      cena('c2'); const u = t - 2.2;
      const k = document.getElementById('k2'); const e = passo(u / .18, 3);
      k.style.transform = `scale(${1.5 - .5 * e})`; k.style.opacity = u > 0 ? 1 : 0;
      const tremor = u > .18 && u < .38 ? (Math.floor(u * 60) % 2 ? 8 : -8) : 0;
      document.getElementById('c2').style.transform = `translate(${tremor}px, ${-tremor/2}px)`;
      construir(S.s2, .2, .35, u);
      const w = document.getElementById('w2'); const d = passo((u - .45) / .2, 4);
      w.style.opacity = u > .45 ? 1 : 0; w.style.transform = `translateY(${(1 - d) * -60}px)`;
    } else if (t < 6.6) {                                // 3
      cena('c3'); const u = t - 4.4;
      const w = document.getElementById('w3'); const d = ease(u / .3);
      w.style.transform = `translateX(${(1 - d) * -900}px)`;
      construir(S.s3, .3, .4, u);
      const ciclo = u > .8 ? ((u - .8) % .8) / .8 : 0;
      S.s3.box.style.transform = `translateX(${passo(ciclo, 4) * 160 - 40}px)`;
    } else {                                             // 4
      cena('c4'); const u = t - 6.6;
      construir(S.s4, 0, .35, u);
      const w = document.getElementById('w4'); w.style.opacity = u > .3 ? 1 : 0;
    }
  };
  window.DURACAO = 7.6;
  window.SONS = [ // [segundo, arquivo, volume]
    [0.05,'whoosh-short.mp3',.5],[0.35,'sparkle.mp3',.55],[0.95,'pop.mp3',.5],
    [2.2,'whoosh.mp3',.45],[2.36,'impact-bass-1.mp3',.7],[2.65,'click.mp3',.45],
    [4.4,'whoosh-short.mp3',.5],[4.7,'key-press.mp3',.4],
    [5.2,'click-soft.mp3',.35],[5.4,'click-soft.mp3',.35],[5.6,'click-soft.mp3',.35],[5.8,'click-soft.mp3',.35],
    [6.0,'click-soft.mp3',.35],[6.2,'click-soft.mp3',.35],[6.4,'click-soft.mp3',.35],
    [6.6,'glitch-1.mp3',.35],[6.95,'chime.mp3',.45]
  ];
  document.fonts.ready.then(() => window.quadro(0));
</script>
</body>
</html>
