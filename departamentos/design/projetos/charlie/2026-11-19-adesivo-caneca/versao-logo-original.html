<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Equipe Charlie — adesivo com o LOGO ORIGINAL do cliente ocupando o adesivo inteiro (sem círculo dentro de círculo).
     Usa logo-limpo.png (sem marca d’água, 1254 px), enviado pela pessoa em 19/11/2026. -->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@900&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --diametro:60mm; --sangria:2mm; --seguro:3mm; --fundo:#1C1C19; --amarelo:#F3DC1E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; }
  .adesivo { width:calc(var(--diametro) + 2*var(--sangria)); height:calc(var(--diametro) + 2*var(--sangria));
    border-radius:50%; overflow:hidden; position:relative; background:var(--fundo); }
  svg.arte { position:absolute; inset:0; width:100%; height:100%; }
  .nome { position:absolute; left:23%; right:23%; top:73%; height:8.5mm; display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:'Big Shoulders Display', sans-serif; font-weight:800; text-transform:uppercase;
    line-height:1; white-space:nowrap; letter-spacing:.06em; color:var(--amarelo);
    text-shadow: .25mm .25mm 0 #0d0f0a, -.15mm -.15mm 0 #0d0f0a, .15mm -.15mm 0 #0d0f0a, -.15mm .15mm 0 #0d0f0a; }
  .guia-corte, .guia-seguro { display:none; position:absolute; border-radius:50%; }
  .guias .guia-corte { display:block; inset:var(--sangria); border:.2mm dashed #ff2d55; }
  .guias .guia-seguro { display:block; inset:calc(var(--sangria) + var(--seguro)); border:.2mm dotted #00e0ff; }
</style>
</head>
<body>
<div class="adesivo">
  <svg class="arte" viewBox="0 0 64 64">
    <defs>
      <radialGradient id="esfumar" cx="50%" cy="50%" r="50%">
        <stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </radialGradient>
      <mask id="borda"><rect width="64" height="64" fill="#000"/><rect x="5" y="2.5" width="54" height="54" fill="url(#esfumar)"/></mask>
      <path id="arco" d="M 9.6 32 A 22.4 22.4 0 0 1 54.4 32"/>
    </defs>
    <!-- logo original, grande, se misturando ao fundo -->
    <image href="../../../entregas/charlie/material/logo-limpo.png" x="5" y="2.5" width="54" height="54" preserveAspectRatio="xMidYMid slice" mask="url(#borda)"/>
    <!-- anel fino -->
    <circle cx="32" cy="32" r="28.2" fill="none" stroke="var(--amarelo)" stroke-width=".35" opacity=".9"/>
    <!-- EQUIPE -->
    <text font-family="Big Shoulders Stencil Display" font-weight="900" font-size="4.6" letter-spacing="1.6" fill="var(--amarelo)"
      stroke="#0d0f0a" stroke-width=".5" paint-order="stroke" text-anchor="middle"><textPath href="#arco" startOffset="50%">EQUIPE</textPath></text>
  </svg>
  <div class="nome"><span data-campo="nome">NOME</span></div>
  <div class="guia-corte"></div><div class="guia-seguro"></div>
</div>
<script>
  window.ajustarTexto = () => {
    document.querySelectorAll('.nome').forEach(caixa => {
      const span = caixa.querySelector('[data-campo=nome]');
      const encaixar = (inicio, minimo) => { let t = inicio; caixa.style.fontSize = t + 'mm';
        while ((span.scrollWidth > caixa.clientWidth || span.scrollHeight > caixa.clientHeight || caixa.scrollWidth > caixa.clientWidth) && t > minimo) { t -= .25; caixa.style.fontSize = t + 'mm'; }
        return t; };
      caixa.style.whiteSpace = 'nowrap'; span.style.display = '';
      let t = encaixar(6.75, 3); // máximo = tamanho do "João Pedro" (todos iguais)
      if (t < 4.5 && span.textContent.trim().includes(' ')) { caixa.style.whiteSpace = 'normal'; span.style.display = 'block'; caixa.style.lineHeight = '.95'; t = encaixar(6.5, 3); }
      caixa.dataset.tamanho = t;
    });
  };
  document.fonts.ready.then(window.ajustarTexto);
</script>
</body>
</html>
