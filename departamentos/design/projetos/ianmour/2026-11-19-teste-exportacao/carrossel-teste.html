<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Silkscreen:wght@400;700&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --rosa:#FC3B7F; --creme:#FEF1CF; --azul:#0032A8; --noite:#0A0A14; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; }
  .lamina { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--noite); color:var(--creme); font-family:'Archivo', sans-serif; }

  /* grade de pixels no fundo */
  .lamina::before { content:''; position:absolute; inset:0;
    background-image: linear-gradient(rgba(254,241,207,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(254,241,207,.05) 1px, transparent 1px);
    background-size: 54px 54px; }

  .pixel { font-family:'Silkscreen', monospace; }
  .marca { position:absolute; left:72px; bottom:64px; font-size:30px; color:var(--creme); letter-spacing:2px; }
  .seta { position:absolute; right:72px; bottom:58px; font-family:'Silkscreen'; font-size:40px; color:var(--rosa); }

  /* lâmina 1 */
  .l1 .faixa { position:absolute; left:-40px; right:-40px; top:420px; height:600px; background:var(--rosa); transform:rotate(-4deg); }
  .l1 .titulo { position:absolute; left:72px; right:72px; top:200px; font-family:'Anton', sans-serif; text-transform:uppercase; line-height:.88; }
  .l1 .t1 { font-size:190px; color:var(--creme); }
  .l1 .t2 { font-size:300px; color:var(--noite); margin-top:190px; transform:rotate(-4deg); transform-origin:left; }
  .l1 .t3 { font-size:190px; color:var(--creme); margin-top:90px; }
  .l1 .selo { position:absolute; left:72px; top:80px; background:var(--azul); color:var(--creme); font-size:26px; padding:14px 20px; box-shadow:8px 8px 0 var(--rosa); }

  /* lâmina 2 */
  .l2 { background:var(--azul); }
  .l2 .bloco { position:absolute; left:72px; right:72px; top:180px; }
  .l2 .pergunta { font-family:'Anton', sans-serif; font-size:128px; line-height:.95; text-transform:uppercase; }
  .l2 .pergunta span { color:var(--rosa); font-size:150px; }
  .l2 .apoio { margin-top:72px; font-size:48px; line-height:1.3; font-weight:500; max-width:820px; }
  .l2 .caixa { position:absolute; left:72px; bottom:170px; background:var(--creme); color:var(--noite); font-family:'Silkscreen'; font-size:34px; padding:22px 28px; box-shadow:10px 10px 0 var(--rosa); }
</style>
</head>
<body>

<section class="lamina l1">
  <div class="faixa"></div>
  <div class="selo pixel">DESIGN 01</div>
  <div class="titulo">
    <div class="t1">Post bonito</div>
    <div class="t2">não</div>
    <div class="t3">basta.</div>
  </div>
  <div class="marca pixel">@IANMOUR</div>
  <div class="seta">&gt;&gt;</div>
</section>

<section class="lamina l2">
  <div class="bloco">
    <div class="pergunta">Dá pra saber que é <span>seu</span> sem ver o nome?</div>
    <p class="apoio">Se a resposta é não, falta identidade. Cor, letra e jeito de falar que só você tem.</p>
  </div>
  <div class="caixa">SALVA ESSE POST</div>
  <div class="marca pixel">@IANMOUR</div>
</section>

</body>
</html>
