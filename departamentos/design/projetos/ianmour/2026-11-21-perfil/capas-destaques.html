<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Capas dos destaques do Instagram (1080x1920, uma por lâmina). O Instagram mostra só o círculo do meio: o símbolo fica centralizado. -->
<script src="../../../marca-ianmour/simbolos.js"></script>
<style>
  :root { --rosa:#FC3B7F; --creme:#FEF1CF; --azul:#0032A8; --noite:#0A0A14; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; }
  .lamina { width:1080px; height:1920px; position:relative; display:grid; place-items:center; }
  .s { width:580px; height:580px; }
  .s svg { width:100%; height:100%; display:block; overflow:visible; }
</style>
</head>
<body>
  <section class="lamina" style="background:var(--rosa)"><div class="s" data-s="controle:creme"></div></section>
  <section class="lamina" style="background:linear-gradient(90deg,var(--rosa) 50%,var(--azul) 50%)"><div class="s" data-s="mira:creme"></div></section>
  <section class="lamina" style="background:var(--azul)"><div class="s" data-s="olho:creme"></div></section>
  <section class="lamina" style="background:var(--noite)"><div class="s" data-s="raio:rosa"></div></section>
<script>document.querySelectorAll('[data-s]').forEach(e => { const [n, c] = e.dataset.s.split(':'); e.innerHTML = window.SIMBOLOS[n].svg[c]; });</script>
</body>
</html>
