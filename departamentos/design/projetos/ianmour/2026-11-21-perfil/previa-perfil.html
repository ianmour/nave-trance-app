<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Prévia do topo do perfil (só para a pessoa visualizar; layout genérico de rede social). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:2340px; background:#000; color:#f5f5f5; font-family:'Inter', sans-serif; overflow:hidden; }
  .topo { padding:60px 48px 0; }
  .usuario { font-size:46px; font-weight:700; margin-bottom:44px; }
  .linha { display:flex; align-items:center; gap:60px; }
  .foto { width:250px; height:250px; border-radius:50%; object-fit:cover; flex:none; }
  .num { display:flex; gap:70px; text-align:center; font-size:34px; }
  .num b { display:block; font-size:42px; }
  .nome { font-size:36px; font-weight:600; margin-top:36px; }
  .bio { font-size:36px; line-height:1.4; margin-top:8px; white-space:pre-line; }
  .destaques { display:flex; gap:44px; padding:56px 48px 40px; }
  .dest { text-align:center; font-size:28px; }
  .dest img { width:170px; height:170px; border-radius:50%; object-fit:cover; border:6px solid #000; outline:3px solid #555; margin-bottom:14px; display:block; }
  .feed { width:1080px; display:block; }
</style>
</head>
<body>
  <div class="topo">
    <div class="usuario">ianmour</div>
    <div class="linha"><img class="foto" src="../../../entregas/ianmour/perfil/foto-perfil.jpg">
      <div class="num"><div><b>9</b>posts</div><div><b>—</b>seguidores</div><div><b>—</b>seguindo</div></div></div>
    <div class="nome">ianmour | drone &amp; vídeo</div>
    <div class="bio">🎮 PLAYER 1 · bem-vindo ao meu mundo
🚁 drone · vídeo · design
↓ escolha seu mundo: game · missão · real</div>
  </div>
  <div class="destaques">
    <div class="dest"><img src="../../../entregas/ianmour/perfil/destaque-1-game.png">GAME</div>
    <div class="dest"><img src="../../../entregas/ianmour/perfil/destaque-2-missao.png">MISSÃO</div>
    <div class="dest"><img src="../../../entregas/ianmour/perfil/destaque-3-real.png">REAL</div>
    <div class="dest"><img src="../../../entregas/ianmour/perfil/destaque-4-jobs.png">JOBS</div>
  </div>
  <img class="feed" src="../../../entregas/ianmour/feed/feed-rosa-azul.png">
</body>
</html>
